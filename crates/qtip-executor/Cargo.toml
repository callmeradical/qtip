[package]
name = "qtip-executor"
version = "0.1.0"
edition = "2024"
description = "Scenario execution, check evaluation, and adapter orchestration for qtip"
license = "ISC"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
jsonpath-rust = "1.0"
tokio = { version = "1.50.0", features = ["process", "io-util", "fs", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }

[features]
default = ["http"]
http = ["reqwest"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
