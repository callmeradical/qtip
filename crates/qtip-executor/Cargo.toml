[package]
name = "qtip-executor"
version = "0.1.0"
edition = "2024"
description = "Scenario execution, check evaluation, and adapter orchestration for qtip"
license = "ISC"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
jsonpath-rust = "1.0"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
